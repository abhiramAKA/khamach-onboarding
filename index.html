<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, maximum-scale=1.0, user-scalable=no">
    <title>КХАМАЧ — Обучение</title>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; background:#050508; display:flex; justify-content:center; align-items:center; font-family:'Georgia', serif; user-select:none; -webkit-user-select:none; }
        .gate-window { width:92vw; max-width:400px; background:radial-gradient(circle, #1a1512 0%, #0d0a08 100%); border:4px solid #1a1613; outline:2px solid #8a7350; outline-offset:-3px; padding:25px 20px; text-align:center; box-sizing:border-box; box-shadow:0 0 30px rgba(0,0,0,0.95); }
        h1 { font-size:36px; color:#e6c280; letter-spacing:5px; margin:0 0 15px 0; text-shadow:0 2px 4px #000; font-weight:900; }
        .play-btn { width:100%; padding:16px; font-size:18px; font-family:'Georgia', serif; font-weight:bold; letter-spacing:2px; color:#cdb38c; background:linear-gradient(to bottom, #2d2621 0%, #171311 100%); border:1px solid #544432; box-shadow:0 5px 10px rgba(0,0,0,0.6); cursor:pointer; transition:all 0.2s ease; border-radius:4px; text-shadow:2px 2px 2px #000; }
        .play-btn:hover { color:#fff; border-color:#cbb281; box-shadow:0 0 15px rgba(203,178,129,0.5); letter-spacing:3px; }
        .play-btn:active { transform:scale(0.98); }
        .ver { margin-top:15px; font-size:11px; color:#4a453f; letter-spacing:1px; font-weight:bold; }
    </style>
</head>
<body>
    <div class="gate-window">
        <h1>КХАМАЧ</h1>
        <button class="play-btn" onclick="window.location.href='gate.html?t=' + Date.now()">НАЧАТЬ ОБУЧЕНИЕ</button>
        <div class="ver">ПЕСОЧНИЦА ОНБОРДИНГА</div>
    </div>
</body>
</html>
